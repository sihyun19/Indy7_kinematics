<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indy7 3D Kinematics Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #ui-panel {
            position: absolute; top: 16px; right: 16px;
            width: 320px; max-height: calc(100vh - 32px); overflow-y: auto;
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 8px;
            padding: 14px;
            font-size: 12px;
            color: #000000;
            font-family: Arial, sans-serif;
        }
        #joint-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .joint-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 26px;
        }
        .joint-label {
            width: 22px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #000000;
            font-size: 12px;
            flex-shrink: 0;
        }
        .joint-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #d4d4d8;
            outline: none;
            cursor: pointer;
        }
        .joint-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #000000;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .joint-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        .joint-input-container {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .joint-input {
            width: 58px;
            height: 24px;
            padding: 2px 4px;
            border: 1px solid #71717a;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            text-align: right;
            outline: none;
            color: #000000;
            font-weight: bold;
            background: #ffffff;
        }
        .joint-input:focus {
            border-color: #000000;
        }
        .joint-unit {
            font-size: 11px;
            color: #000000;
            font-weight: bold;
            width: 8px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .btn {
            flex: 1;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.2px;
            font-family: Arial, sans-serif;
            transition: all 0.15s;
        }
        .btn-primary {
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
        }
        .btn-primary:hover {
            background: #27272a;
        }
        .btn-secondary {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }
        .btn-secondary:hover {
            background: #f4f4f5;
        }
        .pose-container {
            display: flex;
            gap: 8px;
        }
        .pose-box {
            flex: 1;
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 6px;
            padding: 8px 10px;
        }
        .box-title {
            font-size: 11px;
            color: #000000;
            font-weight: bold;
            letter-spacing: 0.3px;
            padding-bottom: 4px;
            border-bottom: 1px solid #000000;
            margin-bottom: 6px;
        }
        .pose-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            margin-bottom: 3px;
        }
        .pose-row:last-child {
            margin-bottom: 0;
        }
        .axis-label {
            color: #000000;
            font-weight: bold;
        }
        .num-val {
            color: #000000;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
    </style>
    <!-- Three.js 및 필수 부가 라이브러리 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <div id="joint-controls">
            <div class="joint-row">
                <span class="joint-label">J1</span>
                <input type="range" class="joint-slider" id="slider-q0" min="-175" max="175" step="0.5" value="0">
                <div class="joint-input-container">
                    <input type="number" class="joint-input" id="input-q0" min="-175" max="175" step="0.5" value="0.0">
                    <span class="joint-unit">°</span>
                </div>
            </div>
            <div class="joint-row">
                <span class="joint-label">J2</span>
                <input type="range" class="joint-slider" id="slider-q1" min="-175" max="175" step="0.5" value="0">
                <div class="joint-input-container">
                    <input type="number" class="joint-input" id="input-q1" min="-175" max="175" step="0.5" value="0.0">
                    <span class="joint-unit">°</span>
                </div>
            </div>
            <div class="joint-row">
                <span class="joint-label">J3</span>
                <input type="range" class="joint-slider" id="slider-q2" min="-175" max="175" step="0.5" value="0">
                <div class="joint-input-container">
                    <input type="number" class="joint-input" id="input-q2" min="-175" max="175" step="0.5" value="0.0">
                    <span class="joint-unit">°</span>
                </div>
            </div>
            <div class="joint-row">
                <span class="joint-label">J4</span>
                <input type="range" class="joint-slider" id="slider-q3" min="-175" max="175" step="0.5" value="0">
                <div class="joint-input-container">
                    <input type="number" class="joint-input" id="input-q3" min="-175" max="175" step="0.5" value="0.0">
                    <span class="joint-unit">°</span>
                </div>
            </div>
            <div class="joint-row">
                <span class="joint-label">J5</span>
                <input type="range" class="joint-slider" id="slider-q4" min="-175" max="175" step="0.5" value="0">
                <div class="joint-input-container">
                    <input type="number" class="joint-input" id="input-q4" min="-175" max="175" step="0.5" value="0.0">
                    <span class="joint-unit">°</span>
                </div>
            </div>
            <div class="joint-row">
                <span class="joint-label">J6</span>
                <input type="range" class="joint-slider" id="slider-q5" min="-215" max="215" step="0.5" value="0">
                <div class="joint-input-container">
                    <input type="number" class="joint-input" id="input-q5" min="-215" max="215" step="0.5" value="0.0">
                    <span class="joint-unit">°</span>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button id="btn-home" class="btn btn-primary">Home (0°)</button>
            <button id="btn-test" class="btn btn-secondary">Test Pose</button>
        </div>

        <div class="pose-container">
            <div class="pose-box">
                <div class="box-title">Position (mm)</div>
                <div class="pose-row"><span class="axis-label">X</span><span id="tcp-x" class="num-val">0.0</span></div>
                <div class="pose-row"><span class="axis-label">Y</span><span id="tcp-y" class="num-val">-186.5</span></div>
                <div class="pose-row"><span class="axis-label">Z</span><span id="tcp-z" class="num-val">1328.0</span></div>
            </div>

            <div class="pose-box">
                <div class="box-title">Rotation (deg)</div>
                <div class="pose-row"><span class="axis-label">Roll</span><span id="tcp-roll" class="num-val">0.0°</span></div>
                <div class="pose-row"><span class="axis-label">Pitch</span><span id="tcp-pitch" class="num-val">0.0°</span></div>
                <div class="pose-row"><span class="axis-label">Yaw</span><span id="tcp-yaw" class="num-val">0.0°</span></div>
            </div>
        </div>
    </div>
    <script src="viewer.js"></script>
</body>
</html>
